[workspace]
# Build each core separately: their HAL chip features are incompatible.
members = ["firmware/m7", "firmware/m4", "firmware/shared"]
default-members = ["firmware/m7"]
exclude = ["vendor/cyw43"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
embedded-storage-async = "0.4.1"
sequential-storage = "=8.0.2"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.7", features = ["set-vtor"] }
panic-halt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = "0.6.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", default-features = false, features = ["tcp", "udp", "proto-ipv4", "medium-ethernet"] }
cyw43 = "=0.7.0"
leasehund = { version = "0.6.0", default-features = false }
picoserve = { version = "0.19.0", features = ["embassy", "json"] }
static_cell = "2.1.1"
serde-json-core = { version = "0.7.0", default-features = false }
defmt = "1.2.0"
defmt-rtt = { version = "1.3.1", features = ["disable-blocking-mode"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false }
heapless = { version = "0.9.3", default-features = false, features = ["serde"] }
giga-r1 = { version = "0.5.0", default-features = false, features = ["ipc"] }
shared = { path = "firmware/shared" }

[patch.crates-io]
cyw43 = { path = "vendor/cyw43" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
large_stack_frames = "deny"
mem_forget = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = 2
