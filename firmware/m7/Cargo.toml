[package]
name = "m7"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "m7"
path = "src/main.rs"

[[bin]]
name = "bootloader"
path = "src/bootloader/main.rs"
test = false
bench = false

[features]
default = []
defmt = ["shared/defmt", "dep:defmt-rtt", "embassy-stm32/defmt", "embassy-time/defmt"]

[lints]
workspace = true

[dependencies]
embassy-boot = "=0.7.0"
embedded-storage = "=0.3.2"
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft-compact"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast"] }
postcard.workspace = true
shared.workspace = true
heapless.workspace = true
serde.workspace = true
serde-json-core.workspace = true
embassy-net-driver = "0.2.0"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
panic-halt.workspace = true
embassy-executor.workspace = true
embassy-sync.workspace = true
defmt-rtt = { workspace = true, optional = true }
embassy-stm32 = { workspace = true, features = ["stm32h747xi-cm7", "time-driver-tim2", "cyw43", "unstable-pac"] }
embassy-time.workspace = true
embassy-futures.workspace = true
embassy-net.workspace = true
cyw43.workspace = true
leasehund.workspace = true
picoserve.workspace = true
giga-r1 = { workspace = true, features = ["wifi"] }
static_cell.workspace = true
