[package]
name = "loader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Tooling-only opt-in; neither application gains a behavior feature.
[features]
default = []
programming = []

[[bin]]
name = "loader"
path = "loader.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
large_stack_frames = "deny"
mem_forget = "deny"
