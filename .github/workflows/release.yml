name: Release

on:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Prepare release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const safeTag = tag.replace(/[^A-Za-z0-9._-]/g, '-');
          fs.appendFileSync(process.env.GITHUB_ENV, `ASSET_NAME=giga-usb-${safeTag}\n`);
          const heading = `## [${tag}]`;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n');
          const start = lines.findIndex(line => line === heading || line.startsWith(`${heading} - `));
          if (start < 0) throw new Error(`Missing CHANGELOG.md entry for ${tag}`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith('## '));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`Empty CHANGELOG.md entry for ${tag}`);
          fs.mkdirSync('target', { recursive: true });
          fs.writeFileSync('target/release-notes.md', `${notes}\n`);
          NODE
      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run check
      - name: Prepare OTA build identity
        env:
          PUBLIC_KEY: ${{ secrets.FIRMWARE_SIGNING_PUBLIC_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPublicKey } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const key = createPublicKey(process.env.PUBLIC_KEY);
          if (key.asymmetricKeyType !== 'ed25519') throw new Error('Ed25519 public key required');
          const der = key.export({ format: 'der', type: 'spki' });
          const hex = der.subarray(-32).toString('hex');
          if (hex === '0'.repeat(64)) throw new Error('Zero public key');
          const id = `git-${process.env.GITHUB_SHA}`;
          if (!/^[A-Za-z0-9._-]{1,48}$/.test(id)) throw new Error('Invalid OTA build ID');
          appendFileSync(process.env.GITHUB_ENV, `GIGAUSB_OTA_PUBLIC_KEY_HEX=${hex}\nGIGAUSB_OTA_BUILD_ID=${id}\n`);
          NODE
      - name: Build matching firmware
        run: |
          rustup show active-toolchain
          cargo fmt --all -- --check
          cargo clippy -p m4 --release --no-default-features --locked -- -D warnings
          cargo clippy -p m7 --release --no-default-features --locked -- -D warnings
          cargo build -p m4 --release --no-default-features --locked
          cargo build -p m7 --release --no-default-features --locked
      - name: Verify release logging is disabled
        shell: bash
        run: |
          for core in m4 m7 bootloader; do
            image="target/thumbv7em-none-eabihf/release/$core"
            readelf --sections --wide "$image" > "target/$core-release-sections.txt"
            readelf --symbols --wide "$image" > "target/$core-release-symbols.txt"
            if grep -Eq '[[:space:]]\.defmt([[:space:].]|$)' "target/$core-release-sections.txt" ||
               grep -q '_SEGGER_RTT' "target/$core-release-symbols.txt"; then
              echo "Unexpected defmt/RTT instrumentation in $core release image." >&2
              exit 1
            fi
          done
      - name: Install signing tool
        run: python -m pip install --disable-pip-version-check imgtool==2.5.0
      - name: Package OTA and sign distribution
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ secrets.FIRMWARE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/firmware-signing.pem"
          trap 'rm -f "$key"' EXIT
          test -n "$SIGNING_KEY" || { echo 'FIRMWARE_SIGNING_KEY is required.' >&2; exit 1; }
          test -n "$PUBLIC_KEY" || { echo 'FIRMWARE_SIGNING_PUBLIC_KEY is required.' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > "$key"
          unset SIGNING_KEY
          mkdir -p target/release-assets
          printf '%s\n' "$PUBLIC_KEY" > "target/release-assets/$ASSET_NAME-public.pem"
          node --input-type=module <<'NODE'
          import { createPublicKey } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { parseElfSegments } from './web/src/installer/verify.ts';
          const publicKey = createPublicKey(process.env.PUBLIC_KEY);
          const der = publicKey.export({ format: 'der', type: 'spki' });
          const raw = der.subarray(-32);
          const privatePublic = createPublicKey(readFileSync(`${process.env.RUNNER_TEMP}/firmware-signing.pem`));
          if (!der.equals(privatePublic.export({ format: 'der', type: 'spki' })) ||
              raw.toString('hex') !== process.env.GIGAUSB_OTA_PUBLIC_KEY_HEX) {
            throw new Error('Signing key does not match compiled OTA trust anchor');
          }
          for (const [name, profile] of [['bootloader', 'bootloader'], ['m7', 'm7-ota']]) {
            const elf = readFileSync(`target/thumbv7em-none-eabihf/release/${name}`);
            const loaded = Buffer.concat(parseElfSegments(elf, profile).map(segment => segment.data));
            if (!loaded.includes(raw)) throw new Error(`${name} lacks configured trust anchor`);
            if (name === 'm7' && !loaded.includes(Buffer.from(process.env.GIGAUSB_OTA_BUILD_ID))) {
              throw new Error('M7 lacks configured build ID');
            }
          }

          NODE
          node web/src/ota/build.ts bootstrap \
            target/thumbv7em-none-eabihf/release/bootloader \
            target/thumbv7em-none-eabihf/release/m7 \
            target/thumbv7em-none-eabihf/release/m4 \
            dist/dashboard.qspi.bin "$key" "$GIGAUSB_OTA_BUILD_ID" target/release-package
          node web/src/ota/build.ts ota \
            target/thumbv7em-none-eabihf/release/m7 \
            target/thumbv7em-none-eabihf/release/m4 \
            dist/dashboard.qspi.bin "$key" "$GIGAUSB_OTA_BUILD_ID" \
            "target/release-assets/$ASSET_NAME.ota.bin"
          node --input-type=module <<'NODE'
          import { verifyOtaFile } from './web/src/ota/format.ts';
          const manifest = verifyOtaFile(`target/release-assets/${process.env.ASSET_NAME}.ota.bin`, process.env.PUBLIC_KEY);
          if (manifest.buildId !== process.env.GIGAUSB_OTA_BUILD_ID) throw new Error('OTA build ID mismatch');
          NODE
          cp dist/index.html.gz dist/dashboard.qspi.bin dist/dashboard.qspi.bin.json target/release-package/
          cp README.md AGENTS.md USB-IDS-LICENSE.txt target/release-package/
          cp LICENSE CHANGELOG.md target/release-package/
          {
            printf 'Tag: %s\nCommit: ' "$RELEASE_TAG"
            git rev-parse HEAD
            rustc --version
            printf 'Features: none (defmt disabled)\nLayout: OTA-v1\nBuild ID: %s\n' "$GIGAUSB_OTA_BUILD_ID"
            node --input-type=module -e 'import {createHash,createPublicKey} from "node:crypto"; console.log("Trust fingerprint (SHA256 SPKI DER): " + createHash("sha256").update(createPublicKey(process.env.PUBLIC_KEY).export({format:"der",type:"spki"})).digest("hex"));'
            printf 'Experimental OTA bootstrap profile; read README.md and AGENTS.md before deployment.\nFirst installation uses bootstrap HEX and requires a separately validated external loader. No compatible loader is supplied.\nNever flash the distribution container or OTA candidate directly over SWD.\n'
          } > target/release-package/BUILD.txt
          cp target/release-package/bootstrap.hex "target/release-assets/$ASSET_NAME.hex"
          (cd target/release-package && sha256sum *.elf *.bin *.json *.hex *.gz *.md *.txt LICENSE > SHA256SUMS)
          tar -czf "target/release-assets/$ASSET_NAME.tar.gz" -C target/release-package .

          imgtool sign --key "$key" --version 0.0.0 \
            --header-size 0x200 --pad-header --align 4 --slot-size 0x4000000 \
            --non-bootable "target/release-assets/$ASSET_NAME.tar.gz" "target/release-assets/$ASSET_NAME.signed.bin"
          imgtool verify --key "target/release-assets/$ASSET_NAME-public.pem" "target/release-assets/$ASSET_NAME.signed.bin"
          dd if="target/release-assets/$ASSET_NAME.signed.bin" bs=1 skip=512 \
            count="$(wc -c < "target/release-assets/$ASSET_NAME.tar.gz")" status=none \
            | cmp - "target/release-assets/$ASSET_NAME.tar.gz"
      - name: Checksum release assets
        run: |
          (cd target/release-assets && sha256sum *.tar.gz *.signed.bin *.hex *.ota.bin *-public.pem > "$ASSET_NAME-SHA256SUMS")
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: target/release-notes.md
          prerelease: ${{ github.event.release.prerelease }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            target/release-assets/${{ env.ASSET_NAME }}.tar.gz
            target/release-assets/${{ env.ASSET_NAME }}.signed.bin
            target/release-assets/${{ env.ASSET_NAME }}.hex
            target/release-assets/${{ env.ASSET_NAME }}.ota.bin
            target/release-assets/${{ env.ASSET_NAME }}-public.pem
            target/release-assets/${{ env.ASSET_NAME }}-SHA256SUMS
