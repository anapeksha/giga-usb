name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Validate version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          }
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run check
      - name: Build matching firmware
        run: |
          rustup show active-toolchain
          cargo fmt --all -- --check
          cargo clippy -p m4 --release --features defmt --locked -- -D warnings
          cargo clippy -p m7 --release --features defmt --locked -- -D warnings
          cargo build -p m4 --release --features defmt --locked
          cargo build -p m7 --release --features defmt --locked
      - name: Package release
        shell: bash
        run: |
          mkdir -p target/release-package target/release-assets
          cp target/thumbv7em-none-eabihf/release/m4 target/release-package/m4.elf
          cp target/thumbv7em-none-eabihf/release/m7 target/release-package/m7.elf
          cp dist/index.html.gz target/release-package/
          cp LICENSE target/release-package/
          {
            printf 'Tag: %s\nCommit: ' "$RELEASE_TAG"
            git rev-parse HEAD
            rustc --version
            printf 'Features: defmt\nFlash M4 then M7; verify and system-reset. M7 overwrites the Arduino bootloader.\n'
          } > target/release-package/BUILD.txt
          (cd target/release-package && sha256sum m4.elf m7.elf index.html.gz LICENSE BUILD.txt > SHA256SUMS)
          tar -czf target/release-assets/giga-usb.tar.gz -C target/release-package .
      - name: Install signing tool
        run: python -m pip install --disable-pip-version-check imgtool==2.5.0
      - name: Sign and verify distribution container
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.FIRMWARE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/firmware-signing.pem"
          trap 'rm -f "$key"' EXIT
          test -n "$SIGNING_KEY" || { echo 'FIRMWARE_SIGNING_KEY is required.' >&2; exit 1; }
          test -n "$PUBLIC_KEY" || { echo 'FIRMWARE_SIGNING_PUBLIC_KEY is required.' >&2; exit 1; }
          printf '%s\n' "$SIGNING_KEY" > "$key"
          printf '%s\n' "$PUBLIC_KEY" > target/release-assets/signing-public.pem
          imgtool sign --key "$key" --version "${RELEASE_TAG#v}" \
            --header-size 0x200 --pad-header --align 4 --slot-size 0x4000000 \
            --non-bootable target/release-assets/giga-usb.tar.gz target/release-assets/giga-usb.signed.bin
          imgtool verify --key target/release-assets/signing-public.pem target/release-assets/giga-usb.signed.bin
          dd if=target/release-assets/giga-usb.signed.bin bs=1 skip=512 \
            count="$(wc -c < target/release-assets/giga-usb.tar.gz)" status=none \
            | cmp - target/release-assets/giga-usb.tar.gz
          (cd target/release-assets && sha256sum giga-usb.tar.gz giga-usb.signed.bin signing-public.pem > SHA256SUMS)
      - name: Publish release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > target/release-is-draft; then
            grep -qx true target/release-is-draft || { echo 'Release is already published; refusing to replace assets.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "$RELEASE_TAG" \
              --notes 'Matching M4/M7 firmware and dashboard. Verify the signed distribution before flashing; see AGENTS.md. M7 overwrites the Arduino bootloader.'
          fi
          gh release upload "$RELEASE_TAG" target/release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
